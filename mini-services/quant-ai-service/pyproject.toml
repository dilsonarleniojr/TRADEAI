[project]
name = "quant-ai-service"
version = "0.1.0"
description = "Microservico Quantitativo de IA: Conformal Prediction, Robustez Adversarial L2 e Visao Gemini 2.5 Flash"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.3.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
