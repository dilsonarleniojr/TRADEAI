services:
  tradeai-quant-ai:
    build:
      context: ./mini-services/quant-ai-service
      dockerfile: Dockerfile
    container_name: tradeai_quant_ai
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      - PORT=8001
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}

  tradeai-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradeai_app
    restart: always
    entrypoint: ["/bin/bash", "/app/start.sh"]
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
    env_file:
      - .env
      # Segredos locais fora do git (ex.: ANTHROPIC_API_KEY). Opcional.
      - path: .env.local
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/db/custom.db
      - QUANT_AI_SERVICE_URL=http://tradeai-quant-ai:8001
    volumes:
      - ./db:/app/db
    depends_on:
      - tradeai-quant-ai

  caddy-proxy:
    image: caddy:alpine
    container_name: trade_caddy_proxy
    restart: always
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - tradeai-app
