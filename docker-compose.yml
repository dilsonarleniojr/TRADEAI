services:
  tradeai-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradeai_app
    restart: always
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/db/custom.db
    volumes:
      - ./db:/app/db
